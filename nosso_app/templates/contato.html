{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="container mt-5">

    

    <div class="row">

        
        <div class="col-md-6">
            <h3>Fale Conosco</h3>

            <p><strong>Empresa:</strong> DjangoLabs</p>
            <p><strong>Email:</strong> contato@djangolabs.com</p>
            <p><strong>Telefone:</strong> (21) 99999-9999</p>

            <img class="logo" src="{% static 'app/img/banner.png' %}"
                 class="img-fluid rounded mt-3"
                 alt="Contato">
        </div>

        
        <div class="col-md-6">
            <h1>Contato</h1>

            <form>

                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text"
                           class="form-control"
                           placeholder="Digite seu nome">
                </div>

                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email"
                           class="form-control"
                           placeholder="Digite seu e-mail">
                </div>

                <div class="mb-3">
                    <label class="form-label">Mensagem</label>

                    <textarea class="form-control"
                              rows="5"
                              placeholder="Digite sua mensagem"></textarea>
                </div>

                <button type="submit"
                        class="btn btn-primary">
                    Enviar
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
