{% extends "base.html" %}
{% load static %}

{% block title %}
Cadastro
{% endblock %}

{% block content %}
<form method="POST" class="form-control container mt-5 text-center">
    <h1>Cadastro de Usuário</h1>
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-danger">Cancelar</button>
    <button type="submit" class="btn btn-primary">Enviar</button>

</form>
{% endblock %}
